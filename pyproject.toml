[project]
name = "auscrawl"
version = "0.1.0"
description = "Fast AUS Banner course data scraper"
requires-python = ">=3.13"
dependencies = [
    "httpx[http2]>=0.28.1",
    "lxml>=6.0.2",
    "rich>=14.3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits the real Banner server"]
addopts = "-m 'not live'"
